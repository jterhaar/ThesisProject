dates:
  start: 2020-01-01T00:00:00
  end: 2023-12-31T23:00:00
  frequency: 6h

input:
  join:
  - pipe:
    - netcdf:
        path: /nobackup/users/haar/radar_data/MFBS/6H20-23-reprojected/{date:strftime(%Y/%m)}/RAD_NL25_RAC_MFBS_06H_{date:strftime(%Y%m%d%H%M)}.nc
  - forcings:
      template: ${input.join.0.pipe.0.netcdf}
      param:
      - cos_latitude
      - cos_longitude
      - sin_latitude
      - sin_longitude
      - cos_julian_day
      - cos_local_time
      - sin_julian_day
      - sin_local_time

